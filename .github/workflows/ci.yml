name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Native Build + Test ──
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          # `--all-features` enables the cpal/ALSA backend; alsa-sys needs the
          # development headers at build-script time.
          # `--all-features` 会启用 cpal/ALSA 后端，alsa-sys 构建脚本需要开发头文件。
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic

      - name: Build
        run: cargo build --all-features

      - name: Test
        run: cargo test --all-features

      - name: Doc
        run: cargo doc --no-deps --document-private-items

  # ── WASM Check (out of V1 scope) ──
  # The V1 release ships native binaries only: the GUI depends on host-only
  # crates (tokio full / libloading / filesystem firmware loading), so the
  # `wasm32-unknown-unknown` target is not part of the V1 matrix.
  # V1 只发布原生产物：GUI 依赖宿主专用 crate（tokio full / libloading /
  # 文件系统固件加载），因此 `wasm32-unknown-unknown` 不在 V1 验证矩阵内。