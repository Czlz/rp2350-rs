name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Needed by softprops/action-gh-release (default GITHUB_TOKEN is read-only).
# 创建 Release 需要写权限（默认 GITHUB_TOKEN 只读）。
permissions:
  contents: write

jobs:
  # ── Native Release Builds ──
  release-native:
    name: Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p dist
          # Workspace binaries: CLI (headless) + GUI.
          # Asset names carry the target triple so the two macOS builds do not
          # collide on the release (GitHub asset names are flat).
          # 工作区二进制：CLI 与 GUI；文件名带目标三元组，避免两个 macOS 产物重名。
          cp target/${{ matrix.target }}/release/rp2350-cli${{ matrix.ext }} dist/rp2350-cli-${{ matrix.target }}${{ matrix.ext }}
          cp target/${{ matrix.target }}/release/rp2350-egui${{ matrix.ext }} dist/rp2350-egui-${{ matrix.target }}${{ matrix.ext }}
          # First-party virtual device plugins ship next to the binaries so
          # `--plugin-dir dist` works out of the box.
          # 第一方虚拟设备插件与二进制同目录分发，`--plugin-dir dist` 即可使用。
          for plugin in rp2350_led_plugin rp2350_uart_terminal; do
            for file in target/${{ matrix.target }}/release/*${plugin}.dll \
                        target/${{ matrix.target }}/release/*${plugin}.so \
                        target/${{ matrix.target }}/release/*${plugin}.dylib; do
              [ -f "$file" ] || continue
              ext="${file##*.}"
              stem="$(basename "$file" ".$ext")"
              cp "$file" "dist/${stem}-${{ matrix.target }}.${ext}"
            done
          done
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rp2350-rs-${{ matrix.target }}
          path: dist/

  # ── WASM Build & Deploy (out of V1 scope) ──
  # Not part of V1: the GUI links host-only crates and the repository has no
  # web entry point (`index.html`/`Trunk.toml`). Native artifacts only.
  # 不属于 V1：GUI 链接宿主专用 crate，仓库也没有 web 入口
  # （`index.html`/`Trunk.toml`）；只发布原生产物。

  # ── GitHub Release (on tag) ──
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-native]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Remove previous release for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Re-running a tag must not accumulate stale assets.
          # 重新发布同一标签时先删除旧 Release，避免残留过期附件。
          gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false || true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Generate release notes
        id: changelog
        run: |
          {
            echo "# rp2350-rs ${GITHUB_REF_NAME}"
            echo
            echo "V1 scope, precision statement and known limits are included below;"
            echo "the same statement ships in \`doc/v1-scope.md\`."
            echo
            sed -n '/^## \[[0-9]/,$p' doc/changelog.md
            echo
            cat doc/v1-scope.md
          } > CHANGES.md
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          cat CHANGES.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGES.md
          files: dist/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}