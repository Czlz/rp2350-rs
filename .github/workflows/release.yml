name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Native Release Builds ──
  release-native:
    name: Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p dist
          # Workspace binaries: CLI (headless) + GUI.
          # 工作区二进制：CLI（无界面）与 GUI。
          cp target/${{ matrix.target }}/release/rp2350-cli${{ matrix.ext }} dist/
          cp target/${{ matrix.target }}/release/rp2350-egui${{ matrix.ext }} dist/
          # First-party virtual device plugins ship next to the binaries so
          # `--plugin-dir dist` works out of the box.
          # 第一方虚拟设备插件与二进制同目录分发，`--plugin-dir dist` 即可使用。
          cp target/${{ matrix.target }}/release/*led_plugin* dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/*uart_terminal* dist/ 2>/dev/null || true
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rp2350-rs-${{ matrix.target }}
          path: dist/

  # ── WASM Build & Deploy (out of V1 scope) ──
  # Not part of V1: the GUI links host-only crates and the repository has no
  # web entry point (`index.html`/`Trunk.toml`). Native artifacts only.
  # 不属于 V1：GUI 链接宿主专用 crate，仓库也没有 web 入口
  # （`index.html`/`Trunk.toml`）；只发布原生产物。

  # ── GitHub Release (on tag) ──
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-native]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Generate release notes
        id: changelog
        run: |
          {
            echo "# rp2350-rs ${GITHUB_REF_NAME}"
            echo
            echo "V1 scope, precision statement and known limits are included below;"
            echo "the same statement ships in \`doc/v1-scope.md\`."
            echo
            sed -n '/^## \[[0-9]/,$p' doc/changelog.md
            echo
            cat doc/v1-scope.md
          } > CHANGES.md
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          cat CHANGES.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGES.md
          files: dist/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}