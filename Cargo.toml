[workspace]
resolver = "3"
members = [
    "crates/rp2350-core",
    "crates/rp2350-cpu",
    "crates/rp2350-arm",
    "crates/rp2350-periph",
    "crates/rp2350-virt-periph",
    "crates/rp2350-plugin",
    "crates/rp2350-ffi",
    "crates/rp2350-gdb",
    "crates/rp2350-egui",
    "crates/rp2350-cli",
    "crates/rp2350-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["RP2350-rs Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Czlz/rp2350-rs"
rust-version = "1.85"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
smallvec = "1"
bitflags = "2"
uuid = { version = "1", features = ["v4"] }
elf = "0.7"
ihex = "3"
eframe = "0.37"
egui = "0.37"
egui-wgpu = "0.37"
egui-winit = "0.37"
egui_plot = "0.37"
winit = "0.30"
wgpu = "24"
image = "0.25"
libloading = "0.8"
abi_stable = "0.12"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
console_error_panic_hook = "0.1"
js-sys = "0.3"
wee_alloc = "0.4"

rp2350-core = { path = "crates/rp2350-core" }
rp2350-cpu = { path = "crates/rp2350-cpu" }
rp2350-arm = { path = "crates/rp2350-arm" }
rp2350-periph = { path = "crates/rp2350-periph" }
rp2350-virt-periph = { path = "crates/rp2350-virt-periph" }
rp2350-plugin = { path = "crates/rp2350-plugin" }
rp2350-ffi = { path = "crates/rp2350-ffi" }
rp2350-gdb = { path = "crates/rp2350-gdb" }
rp2350-egui = { path = "crates/rp2350-egui" }
rp2350-cli = { path = "crates/rp2350-cli" }
rp2350-mcp = { path = "crates/rp2350-mcp" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0