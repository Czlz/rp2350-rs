[package]
name = "rp2350-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "rp2350_cli"
path = "src/lib.rs"

[[bin]]
name = "rp2350-cli"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }

# Internal
rp2350-core = { workspace = true }
rp2350-cpu = { workspace = true }
rp2350-arm = { workspace = true }
rp2350-bootrom = { workspace = true }
rp2350-riscv = { workspace = true }
rp2350-periph = { workspace = true }
rp2350-usb = { workspace = true }
rp2350-usb-host = { workspace = true }
rp2350-virt-periph = { workspace = true }
rp2350-gdb = { workspace = true }
rp2350-mcp = { workspace = true }
rp2350-ffi = { workspace = true }

[dev-dependencies]
# 测试内的进程内 mock `DevicePlugin` 需要基础插件契约（不依赖已构建的 cdylib）。
# In-process mock `DevicePlugin`s in tests need the base plugin contract.
rp2350-plugin = { workspace = true }
