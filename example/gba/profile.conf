# pokeemerald-rp2350 示例 profile / GBA example profile
#
# 本文件里的值都是**示例专用**的（固件路径、帧缓冲、按键引脚、I2S 接线），
# 不属于模拟器默认值；换固件时复制本文件再改，不要改 crate 代码。
# Every value here is example-specific (firmware path, frame buffer, button
# pins, I2S wiring). The emulator has no such defaults; copy this file for
# another firmware instead of editing crate code.

# 固件绝对路径 / absolute firmware path
firmware = E:\Source\mcu\pico\rp2350\gba\pokeemerald-rp2350\rp2350\hw\build_emerald\emerald.uf2

# 帧缓冲：g_fb，240x160 RGB565（stride 480 = 240*2）/ frame buffer
frame = 0x20063DF4:240x160

# 每游戏帧约 2.5 M 步（客户机以 60 fps 自我配速）/ ~2.5 M steps per game frame
steps_per_frame = 2500000

# GBA 按键 GP0..GP9（低有效）/ GBA buttons on GP0..GP9 (active low)
buttons = 0x3FF

# 音频：PIO2 SM0 推送 I2S 字，13440 Hz 立体声
# Audio: PIO2 SM0 pushes I2S words, 13440 Hz stereo
audio = true
audio_block = 2
audio_sm = 0
audio_rate = 13440
audio_channels = 2
audio_capacity = 48000
